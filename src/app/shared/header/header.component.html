<header class="h-14 bg-slate-800 text-white flex items-center justify-between px-4">

    <div class="font-semibold text-lg">
        iThink Music
    </div>

    <div *ngIf="user()" class="flex items-center gap-4 text-sm">
        <div class="text-right">
            <div>{{ user()?.name }}</div>
            <div class="text-slate-300">{{ user()?.email }}</div>
        </div>

        <button class="px-3 py-1 bg-red-600 rounded hover:bg-red-700" (click)="logout()">
            Salir
        </button>
    </div>

</header>
