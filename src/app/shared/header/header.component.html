<header class="header-container">
    <!-- Logo -->
    <div class="logo-section">
      <img src="assets/images/logo.png" alt="Logo" class="logo-image">
      <span class="logo-text">iThink Music</span>
    </div>
  
    <!-- User dropdown -->
    <div *ngIf="user()" class="user-wrapper">
  
      <!-- Trigger -->
      <div class="user-trigger" [class.active]="open()" (click)="toggleMenu()">
        <div class="avatar">
          {{ user()?.username?.charAt(0)?.toUpperCase() }}
        </div>
  
        <span class="username">{{ user()?.username }}</span>
  
        <svg class="chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </div>
  
      <!-- Dropdown -->
      <div *ngIf="open()" class="user-dropdown">
  
        <!-- Roles -->
        <div class="roles-section">
          <div class="section-title">Roles</div>
  
          <div class="roles-grid">
            <div
              *ngFor="let role of roles()"
              class="role-card"
              [class.active]="role.id === activeRole()?.id"
              (click)="changeRole(role)"
            >
              {{ role.name }}
            </div>
          </div>
        </div>
  
        <div class="divider"></div>
  
        <!-- Session info -->
        <div class="session-info">
          <div>
            <span>Inicio:</span>
            <strong>{{ loginTimeFormatted() }}</strong>
          </div>
  
          <div>
            <span>Tiempo activo:</span>
            <strong>{{ elapsedTime() }}</strong>
          </div>
        </div>
  
        <div class="divider"></div>
        <div class="logout">
            <app-buttons title="Salir" [callback]="logout">

            </app-buttons>
      
        </div>
      </div>
    </div>
  </header>
