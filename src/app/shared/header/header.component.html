<header class="header-container">
    <!-- Logo y Título -->
    <div class="logo-section">
        <img src="assets/images/logo.png" alt="iThink Music Logo" class="logo-image">
        <span class="logo-text">iThink Music</span>
    </div>

    <!-- User Section -->
    <div *ngIf="user()" class="user-section">
        <!-- User Info -->
        <div class="user-info">
            <div class="user-name">{{ user()?.username }}</div>
            <div class="user-email">{{ user()?.email }}</div>
        </div>

        <!-- User Avatar -->
        <div class="user-avatar">
            <div class="avatar-circle">
              {{ user()?.username?.charAt(0)?.toUpperCase() }}
            </div>
        </div>

        <!-- Logout Button -->
        <button class="logout-btn" (click)="logout()">
            <svg class="logout-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            <span>Salir</span>
        </button>
    </div>
</header>
