<aside *ngIf="isLoggedIn()" class="navbar-container">

    <!-- Logo Section -->
    <div class="navbar-logo">
        <div class="logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
            </svg>
        </div>
        <span class="logo-text">Menú</span>
    </div>

    <!-- Navigation -->
    <nav class="navbar-nav">

        <div *ngFor="let module of modules()" class="nav-module">

            <!-- TAB PADRE o TAB SIMPLE -->
            <div class="nav-item" [class.has-children]="module.children" [class.expanded]="expanded === module.id"
                (click)="module.children ? toggle(module.id) : select(module)">

                <div class="nav-item-content">
                    <!-- Icono del módulo -->
                    <div class="nav-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                        </svg>
                    </div>

                    <span class="nav-title">{{ module.title }}</span>

                    <!-- Flecha para expandir -->
                    <div *ngIf="module.children" class="nav-arrow">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- SUB-TABS -->
            <div *ngIf="module.children && expanded === module.id" class="nav-submenu">
                <div *ngFor="let child of module.children" class="nav-subitem" (click)="select(child)">

                    <div class="nav-subitem-indicator"></div>
                    <span class="nav-subitem-title">{{ child.title }}</span>
                </div>
            </div>

        </div>

    </nav>

    <!-- Footer del Navbar -->
    <div class="navbar-footer">
        <div class="footer-decoration"></div>
    </div>

</aside>
