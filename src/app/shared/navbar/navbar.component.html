<p>navbar works!</p>
<aside *ngIf="isLoggedIn()" class="w-64 bg-slate-900 text-white h-full">

    <nav class="p-2 space-y-1">

        <div *ngFor="let module of modules()">

            <div class="flex items-center justify-between px-3 py-2 rounded cursor-pointer hover:bg-slate-700"
                (click)="toggle(module.id)">
                <span>{{ module.title }}</span>
                <span *ngIf="module.children">▾</span>
            </div>

            <div *ngIf="module.children && expanded === module.id" class="ml-4 mt-1 space-y-1">
                <a *ngFor="let child of module.children" [routerLink]="child.route"
                    class="block px-3 py-1 rounded text-sm hover:bg-slate-700" routerLinkActive="bg-slate-700">
                    {{ child.title }}
                </a>
            </div>

            <a *ngIf="!module.children" [routerLink]="module.route" class="block px-3 py-2 rounded hover:bg-slate-700"
                routerLinkActive="bg-slate-700">
                {{ module.title }}
            </a>

        </div>

    </nav>
</aside>
