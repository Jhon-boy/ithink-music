<form [formGroup]="loginForm" (ngSubmit)="submit()" class="login-form">

    <h2>Iniciar Sesión</h2>

    <!-- USUARIO -->
    <div class="form-group">
        <label for="username">Usuario</label>
        <input id="username" type="text" formControlName="username"
            [class.invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" />

        <small class="error" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
            El usuario es obligatorio
        </small>
    </div>

    <!-- PASSWORD -->
    <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password"
            [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" />

        <small class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            La contraseña es obligatoria
        </small>
    </div>

    <!-- ERROR GENERAL -->
    <div class="error general" *ngIf="errorMessage">
        {{ errorMessage }}
    </div>

    <!-- BOTÓN -->
    <button type="submit" [disabled]="loading || loginForm.invalid">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
    </button>

</form>
